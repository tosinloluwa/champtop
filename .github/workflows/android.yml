name: Android debug build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          yes | sudo env "JAVA_HOME=$JAVA_HOME" "PATH=$PATH" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          sudo chmod -R a+rwX "$ANDROID_HOME" || true
          # sdkmanager ran as root: make sure the runner user owns its config dirs (debug keystore goes here)
          sudo mkdir -p "$HOME/.android" "$HOME/.config/.android"
          sudo chown -R "$(id -un):$(id -gn)" "$HOME/.android" "$HOME/.config"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('config.xml', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate env, language and icon files
        run: npx gulp

      - name: Show what will be built
        run: |
          node -v
          java -version
          grep -m3 -E '"app_id"|"appname"|"url"' src/assets/env.json | cut -c1-200 || true
          ls src/assets/lib/wa-sqlite/ || echo "WARNING: src/assets/lib/wa-sqlite is missing"

      - name: Add the Android platform
        run: |
          mkdir -p www
          if [ ! -d platforms/android ]; then npx cordova platform add android; fi

      - name: Build the debug APK
        run: npx ionic cordova build android --prod --no-interactive

      - name: Find the APK
        run: find platforms/android -name "*.apk" -print

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: champtop-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14